name: node build and deploy

on:
 push:
  branches:
    - main

env:
  IMAGE_NAME: my-mern-backend

jobs:
  build-deploy:
    runs-on : ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Building Docker Image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest ./backend
        
      - name: Login to Dockerhub
        uses: docker/login-action@v3

        with:
           username: ${{secrets.DOCKER_USERNAME}}  
           password: ${{secrets.DOCKER_PASSWORD}}
      
      - name: Push Image
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}

        with: 
          host: ${{secrets.EC2_Host}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY}}
          envs: MONGO_URL

          script: |
           docker pull ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest
           docker stop my-mern-backend || true
           docker rm my-mern-backend || true
           docker run -d --name my-mern-backend --restart unless-stopped -p 8080:8080 -e  MONGO_URL="$MONGO_URI" ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest
           docker image prune -f
